<!DOCTYPE html>
<!-- App icon (#107). render.sh renders it square at several sizes.
     icon.html: rounded square on a transparent background (favicon, "any" PWA icon, Apple touch icon).
     icon.html?maskable: full-bleed background, mascot inside the maskable safe zone (inner 80% circle). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .bg { position: absolute; inset: 0; background: #FBE4EC; border-radius: 22%; overflow: hidden; }
  .maskable .bg { border-radius: 0; }
  .mascot { position: absolute; left: 50%; top: 52%; width: 112%; transform: translate(-50%, -50%); }
  .maskable .mascot { width: 88%; }
</style>
</head>
<body>
  <div class="bg"><img class="mascot" src="mascot.svg"></div>
  <script>if (location.search.indexOf("maskable") >= 0) document.body.className = "maskable";</script>
</body>
</html>
