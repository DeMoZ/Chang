<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>KruChaang: Learn Thai</title>
    <!-- Chang: page texts and images for search and link previews (#107), images made by Tools/PageArt/render.sh -->
    <meta name="description" content="Learn Thai with Kru Chaang, a friendly elephant teacher. Short lessons with words, sentences, audio and pictures. Made for beginners and travelers. Plays in the browser.">
    <meta name="theme-color" content="#FBF6EC">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KruChaang">
    <meta property="og:title" content="KruChaang: Learn Thai">
    <meta property="og:description" content="Learn Thai with Kru Chaang, a friendly elephant teacher. Short lessons with words, sentences, audio and pictures. Made for beginners and travelers. Plays in the browser.">
    <meta property="og:url" content="https://kruchaang.win/">
    <meta property="og:image" content="https://kruchaang.win/TemplateData/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Kru Chaang the elephant and the KruChaang logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="KruChaang: Learn Thai">
    <meta name="twitter:description" content="Learn Thai with Kru Chaang, a friendly elephant teacher. Short lessons with words, sentences, audio and pictures. Made for beginners and travelers. Plays in the browser.">
    <meta name="twitter:image" content="https://kruchaang.win/TemplateData/og-image.png">
    <link rel="icon" href="TemplateData/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="192x192" href="TemplateData/icons/icon-192.png">
    <link rel="apple-touch-icon" href="TemplateData/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
  <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
#if SHOW_DIAGNOSTICS
    <div id="unity-footer">
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
    </div>
#endif
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
        checkBuildVersion();
      });

      // Chang: build number check (#104). version.json is written next to the page by the WebGL build
      // (WebGLBuildVersion.cs) and served with no-cache. A page from the offline cache or a tab kept open
      // across a deploy runs an old build: then clear the Cache Storage (Service Worker and Unity caches)
      // and reload. Checked on load and when the tab becomes visible again; one reload per deployed version.
      var buildVersion = {{{ JSON.stringify(PRODUCT_VERSION) }}};
      var versionReloadKey = "chang-version-reload";

      async function checkBuildVersion() {
        try {
          var response = await fetch("version.json", { cache: "no-store" });
          if (!response.ok) return;
          var deployed = (await response.json()).version;
          if (!deployed || deployed === buildVersion) {
            sessionStorage.removeItem(versionReloadKey);
            return;
          }
          if (sessionStorage.getItem(versionReloadKey) === deployed) return;
          sessionStorage.setItem(versionReloadKey, deployed);
          console.log("[Chang] build " + buildVersion + " is old, deployed " + deployed + ": reloading");
          if ("caches" in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          location.reload();
        } catch (error) {
          // offline or no version.json: keep the running build
        }
      }

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") checkBuildVersion();
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

#if SHOW_DIAGNOSTICS
        // position the diagnostics icon in the corner on the canvas
        let diagnostics_icon = document.getElementById("diagnostics-icon");
        diagnostics_icon.style.position = "fixed";
        diagnostics_icon.style.bottom = "10px";
        diagnostics_icon.style.right = "0px";
        canvas.after(diagnostics_icon);
#endif

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
#if SHOW_DIAGNOSTICS
          document.getElementById("diagnostics-icon").onclick = () => {
              unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
          };
#endif
#if DEVELOPMENT_PLAYER
          var profile = unityProfiler.createButton(unityInstance);
          profile.style.position = 'fixed';
          profile.style.bottom = '5px';
          profile.style.left = '5px';
          document.body.appendChild(profile);
#endif
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
