// Chang: Google sign-in for Android with Credential Manager ("Sign in with Google").
// Unity adds this folder to the Gradle project as a module. See Docs/save-and-auth.md#google.
apply plugin: 'com.android.library'

android {
    namespace "com.roman.kolychev.chang.googlesignin"
    compileSdk 35

    defaultConfig {
        minSdk 25
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    // Credential Manager on Android 13 and older goes through Google Play services
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
